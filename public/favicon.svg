<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Outer Pins -->
  <path d="M18 4V10M26 4V10M34 4V10M42 4V10M46 4V10" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M18 54V60M26 54V60M34 54V60M42 54V60M46 54V60" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M4 18H10M4 26H10M4 34H10M4 42H10M4 46H10" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M54 18H60M54 26H60M54 34H60M54 42H60M54 46H60" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />

  <!-- Solid Main Chip Body -->
  <rect x="10" y="10" width="44" height="44" rx="10" fill="#0F172A" stroke="url(#chipGrad)" stroke-width="3" />
  
  <!-- Tensor Die Inner Core -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="url(#chipGrad)" />

  <!-- Core Matrix Circuit / "G" Tensor Shape -->
  <path d="M34 24H26C24.3431 24 23 25.3431 23 27V37C23 38.6569 24.3431 40 26 40H38C39.6569 40 41 38.6569 41 37V31H32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent Glowing Corner Node -->
  <circle cx="38" cy="24" r="2.5" fill="#38BDF8" filter="url(#glow)" />
</svg>
